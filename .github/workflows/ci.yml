name: CI

on:
  push:
    branches:
      - 2.4.8-develop
      - 2.4.9-develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (PHP ${{ matrix.php }}, magento/framework ${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', framework: '103.0.8-p5' }
          - { php: '8.4', framework: '103.0.8-p5' }
          - { php: '8.3', framework: '103.0.9' }
          - { php: '8.4', framework: '103.0.9' }
          - { php: '8.5', framework: '103.0.9' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, soap, sodium, xsl, zip
          coverage: none
          tools: composer:v2

      - name: Resolve Magento packages from the Mage-OS mirror
        run: |
          composer config --unset repositories.mage
          composer config repositories.mage-os composer https://mirror.mage-os.org/
          composer config --no-plugins allow-plugins.magento/magento-composer-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.laminas/laminas-dependency-plugin true
          composer require --no-update "magento/framework:${{ matrix.framework }}"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: PHPUnit
        run: composer phpunit

  coding-standard:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, soap, sodium, xsl, zip
          coverage: none
          tools: composer:v2

      - name: Resolve Magento packages from the Mage-OS mirror
        run: |
          composer config --unset repositories.mage
          composer config repositories.mage-os composer https://mirror.mage-os.org/
          composer config --no-plugins allow-plugins.magento/magento-composer-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.laminas/laminas-dependency-plugin true

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: PHP_CodeSniffer, PHPCompatibility, PHPMD and PHPStan
        run: composer coding-standard
